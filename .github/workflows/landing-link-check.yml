name: Landing link check

on:
  push:
    paths:
      - "apps/landing/**"
      - "LICENSE"
      - "NOTICE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/landing-link-check.yml"
  pull_request:
    paths:
      - "apps/landing/**"
      - "LICENSE"
      - "NOTICE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/landing-link-check.yml"
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and verify the complete static publication directory
        run: pnpm --filter @lobbystack/landing build
      - name: Prove content, script, font and attribution regressions are rejected
        run: pnpm --filter @lobbystack/landing pilot:test
      - name: Verify GET and HEAD serve the exact artifact and retired routes return 404
        shell: bash
        run: |
          mkdir -p .tmp
          pnpm --filter @lobbystack/landing preview --host 127.0.0.1 --port 4173 > .tmp/pilot-landing-preview.log 2>&1 &
          preview_pid=$!
          trap 'pnpm --filter @lobbystack/landing exec astro preview stop >/dev/null 2>&1 || true; kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then
              pnpm --filter @lobbystack/landing pilot:http http://127.0.0.1:4173
              exit 0
            fi
            sleep 1
          done
          echo "Pilot static preview did not become ready"
          exit 1
